[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bilidesk"
version = "0.1.0"
description = "BiliBatchDownloader 中文作者作品库"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.11.1", "yt-dlp==2026.8.19", "requests==2.34.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
