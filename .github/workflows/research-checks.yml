name: Research checks (offline only)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned desktop and research dependencies
        run: python -m pip install -r requirements-desktop.lock.txt
      - name: Compile research scripts
        run: python -m compileall -q experiments src scripts
      - name: Create isolated test output parent
        run: New-Item -ItemType Directory -Path .artifacts -Force | Out-Null
      - name: Prepare checksum-pinned FFmpeg for synthetic media checks
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE '.artifacts/tools'
          New-Item -ItemType Directory -Path $toolRoot -ErrorAction Stop | Out-Null
          $zip = Join-Path $toolRoot 'ffmpeg-9.0.2-essentials_build.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $zip -TimeoutSec 180
          $expected = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'FFmpeg publisher checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $toolRoot -ErrorAction Stop
          $ffmpeg = Join-Path $toolRoot 'ffmpeg-9.0.2-essentials_build/bin/ffmpeg.exe'
          $ffprobe = Join-Path $toolRoot 'ffmpeg-9.0.2-essentials_build/bin/ffprobe.exe'
          & $ffmpeg -version | Select-Object -First 1
          & $ffprobe -version | Select-Object -First 1
          "BILI_TEST_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test synthetic contracts only
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --basetemp=.artifacts/pytest-ci --junitxml=.artifacts/tests.xml
      - name: Check dependency consistency
        run: python -m pip check
      - name: Freeze isolated gallery playback experiment
        run: python experiments/build_qt_gallery_spike.py --output .artifacts/qt-gallery-freeze-ci
      - name: Check frozen gallery using synthetic media only
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:BILI_TEST_QT_SPIKE = Join-Path $env:GITHUB_WORKSPACE '.artifacts/qt-gallery-freeze-ci/dist/gallery-qt-spike/gallery-qt-spike.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python -m pytest tests/test_qt_gallery_preview_spike.py -q --basetemp=.artifacts/pytest-qt-frozen --junitxml=.artifacts/qt-gallery-frozen.xml
      - name: Prepare redistribution notices for local CI build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/license-cache -Force | Out-Null
          Copy-Item -LiteralPath packaging/licenses/GPL-3.0.txt -Destination build/license-cache/GPL-3.0.txt
          Copy-Item -LiteralPath packaging/licenses/LGPL-3.0.txt -Destination build/license-cache/LGPL-3.0.txt
      - name: Build portable candidate (no media or credentials)
        run: python scripts/build_windows.py --name BiliBatchDownloader-0.1.0-ci
      - name: Exercise frozen UI and worker without Python on PATH
        run: python scripts/smoke_portable.py --bundle dist/BiliBatchDownloader-0.1.0-ci --output .artifacts/frozen-ci
      - name: Preserve synthetic CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-test-diagnostics
          path: |
            .artifacts/tests.xml
            .artifacts/frozen-ci/**/*.json
            .artifacts/qt-gallery-frozen.xml
            .artifacts/pytest-qt-frozen/**/report.json
            .artifacts/qt-gallery-freeze-ci/build-receipt.json
          if-no-files-found: ignore
